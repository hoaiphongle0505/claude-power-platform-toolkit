<!-- Replace {{...}} with dynamic content. Inline styles only: mail clients ignore <style>. -->
<div style="background:#f0f1f1;padding:24px 0;font-family:Segoe UI,Arial,sans-serif">
<table align="center" width="600" cellpadding="0" cellspacing="0" style="background:#fff;border:1px solid #e3e6e5;width:600px;max-width:100%">
<tr><td style="padding:18px 24px;border-bottom:2px solid #111">
<span style="font-size:16px;font-weight:700;color:#0b6b50">{{Company name}}</span><br>
<span style="font-size:11px;color:#666">{{System name}}</span></td></tr>
<tr><td style="padding:20px 24px">
<div style="display:inline-block;background:#e3f1ec;color:#0b6b50;font-size:11px;font-weight:700;padding:4px 8px">Status: {{Status}}</div>
<div style="font-size:11px;color:#666;margin-top:14px">{{Category}}</div>
<table width="100%" cellpadding="0" cellspacing="0" style="margin-top:6px"><tr>
<td style="font-size:18px;font-weight:700;color:#111">{{Title}}</td>
<td style="text-align:right;font-size:11px;color:#888">{{Date and time}}</td></tr></table>
<table width="100%" cellpadding="0" cellspacing="0" style="margin-top:14px">
<tr><td style="padding:10px 0;border-bottom:1px solid #eef1f0;color:#555;font-size:13px">Label</td>
<td style="padding:10px 0;border-bottom:1px solid #eef1f0;text-align:right;font-weight:600;font-size:13px;color:#111">{{Value}}</td></tr>
<!-- repeat the row for each field -->
</table>
<div style="margin-top:20px"><a href="{{App link}}" style="background:#0b6b50;color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:10px 16px;display:inline-block">Open app</a></div>
</td></tr>
<tr><td style="padding:14px 24px;border-top:1px solid #e3e6e5;font-size:10px;color:#999">This is an automated message. Please do not reply to this email.</td></tr>
</table></div>
